name: Deploy Hub de Jogos

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: games/*/package-lock.json

      # Builda o hub inteiro (todos os jogos) numa tacada só.
      # Esse script detecta sozinho cada pasta em games/: se tiver
      # package.json, ele builda (npm ci + npm run build); se não
      # tiver, copia os arquivos direto (jogo estático).
      # Ao adicionar um novo jogo no futuro, NÃO é preciso mexer
      # neste workflow — só criar a pasta em games/<novo-jogo>/.
      - name: Build do site (hub + jogos)
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
